<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五維財富動力學｜個人資源盤點</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:"Noto Sans TC",sans-serif;
    }

    body{
      background:linear-gradient(135deg,#f8fbff 0%,#eef7ff 100%);
      color:#1e293b;
      padding:32px;
    }

    .container{
      max-width:1400px;
      margin:auto;
    }

    .hero{
      background:white;
      border-radius:20px;
      padding:18px 22px;
      box-shadow:0 8px 28px rgba(0,0,0,.05);
      margin-bottom:14px;
      position:sticky;
      top:8px;
      z-index:10;
    }

    h1{
      font-size:2.5rem;
      margin-bottom:12px;
      background:linear-gradient(90deg,#2563eb,#06b6d4);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .subtitle{
      color:#64748b;
      line-height:1.8;
      margin-bottom:24px;
    }

    .top-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
      gap:10px;
      margin-bottom:14px;
    }

    .score-card{
      background:linear-gradient(135deg,#ffffff,#f1f7ff);
      border:1px solid #dbeafe;
      border-radius:14px;
      padding:10px 12px;
    }

    .score-title{
      color:#64748b;
      margin-bottom:10px;
      font-size:.95rem;
    }

    .score-value{
      font-size:2rem;
      font-weight:800;
      color:#2563eb;
    }

    .section{
      background:white;
      border-radius:28px;
      padding:32px;
      margin-bottom:24px;
      box-shadow:0 10px 40px rgba(0,0,0,.05);
    }

    .section h2{
      margin-bottom:24px;
      color:#0f172a;
    }

    .question{
      padding:18px;
      border-radius:18px;
      border:1px solid #e2e8f0;
      margin-bottom:16px;
      transition:.2s ease;
      background:#fff;
    }

    .question:hover{
      border-color:#93c5fd;
      transform:translateY(-2px);
    }

    .question p{
      line-height:1.8;
      margin-bottom:12px;
      font-weight:500;
    }

    select{
      width:100%;
      padding:12px;
      border-radius:12px;
      border:1px solid #cbd5e1;
      font-size:1rem;
      background:#f8fafc;
    }

    .btn{
      border:none;
      padding:10px 18px;
      border-radius:12px;
      background:linear-gradient(90deg,#2563eb,#06b6d4);
      color:white;
      font-size:1rem;
      cursor:pointer;
      font-weight:700;
      box-shadow:0 6px 18px rgba(37,99,235,.2);
    }

    .report{
      display:none;
      margin-top:40px;
    }

    .report-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-wrap:wrap;
      gap:16px;
      margin-bottom:32px;
    }

    .report-card{
      background:linear-gradient(135deg,#ffffff,#f8fbff);
      border:1px solid #dbeafe;
      border-radius:24px;
      padding:28px;
      margin-bottom:20px;
    }

    .report-card h3{
      margin-bottom:16px;
      color:#1d4ed8;
    }

    .status{
      display:inline-block;
      margin-top:12px;
      padding:8px 14px;
      border-radius:999px;
      background:#dbeafe;
      color:#1d4ed8;
      font-weight:700;
    }

    ul{
      padding-left:20px;
      line-height:2;
      color:#334155;
    }

    canvas{
      max-width:600px;
      margin:30px auto;
    }

    .footer-note{
      margin-top:40px;
      text-align:center;
      color:#64748b;
      line-height:1.8;
    }

    .mini-header{
      position:fixed;
      top:-100px;
      left:50%;
      transform:translateX(-50%);
      width:calc(100% - 32px);
      max-width:1200px;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(14px);
      border:1px solid rgba(255,255,255,.5);
      border-radius:18px;
      padding:12px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
      z-index:999;
      transition:all .35s ease;
    }

    .mini-header.show{
      top:12px;
    }

    .mini-title{
      font-size:1rem;
      font-weight:800;
      color:#0f172a;
    }

    .mini-score{
      font-weight:700;
      color:#2563eb;
    }

    .mini-btn{
      border:none;
      padding:10px 16px;
      border-radius:12px;
      background:linear-gradient(90deg,#2563eb,#06b6d4);
      color:white;
      font-weight:700;
      cursor:pointer;
    }

    .sub-dimension-box{
      margin-top:24px;
      background:#f8fbff;
      border:1px solid #dbeafe;
      border-radius:18px;
      padding:18px;
    }

    .sub-dimension-box h4{
      margin-bottom:18px;
      color:#0f172a;
    }

    .sub-item{
      margin-bottom:14px;
      padding:14px;
      background:white;
      border-radius:14px;
      border:1px solid #e2e8f0;
    }

    .sub-item-title{
      display:flex;
      justify-content:space-between;
      margin-bottom:8px;
      font-weight:700;
    }

    .sub-bar{
      width:100%;
      height:10px;
      background:#e2e8f0;
      border-radius:999px;
      overflow:hidden;
    }

    .sub-bar-fill{
      height:100%;
      border-radius:999px;
      background:linear-gradient(90deg,#2563eb,#06b6d4);
    }

    @media(max-width:768px){
      body{
        padding:16px;
      }

      .hero,.section{
        padding:24px;
      }

      h1{
        font-size:2rem;
      }

      .mini-header{
        width:calc(100% - 16px);
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="hero">

    <h1>五維財富動力學</h1>

    <p class="subtitle">
      個人資源盤點系統｜請使用者直接下拉選單點選分數，點擊「生成個人分析報告」查看結果。
    </p>

    <div class="top-grid">

      <div class="score-card">
        <div class="score-title">金錢 MONEY</div>
        <div class="score-value" id="moneyScore">0.0</div>
      </div>

      <div class="score-card">
        <div class="score-title">精力 ENERGY</div>
        <div class="score-value" id="energyScore">0.0</div>
      </div>

      <div class="score-card">
        <div class="score-title">時間 TIME</div>
        <div class="score-value" id="timeScore">0.0</div>
      </div>

      <div class="score-card">
        <div class="score-title">人脈 CONNECTIONS</div>
        <div class="score-value" id="connectionScore">0.0</div>
      </div>

      <div class="score-card">
        <div class="score-title">能力 CAPABILITY</div>
        <div class="score-value" id="abilityScore">0.0</div>
      </div>

    </div>

    <button class="btn" onclick="generateReport()">
      生成個人分析報告
    </button>

  </div>

  <div class="mini-header" id="miniHeader">

    <div class="mini-title">
      五維財富動力學
    </div>

    <div class="mini-score">
      整體財富轉化效率：<span id="miniOverall">0.0</span>
    </div>

    <button class="mini-btn" onclick="generateReport()">
      生成報告
    </button>

  </div>

  <div id="questionContainer"></div>

  <div class="report" id="reportSection">

    <div class="section">

      <div class="report-header">

        <div>
          <h2>個人深度分析報告</h2>
          <p id="overallText"></p>
        </div>

      </div>

      <canvas id="radarChart"></canvas>

      <div id="reportCards"></div>

    </div>

  </div>

  <div class="footer-note">
    五維財富動力學 © 2026 ｜ Global ESG Leadership Organization
  </div>

</div>

<script>

const dimensions = {
  money:{
    title:"金錢 MONEY",
    description:"財務安全、資產增值與金流管理能力",

    subDimensions:{
      "財務安全":[0,1,2,3],
      "消費與金流":[4,5,6,7],
      "資產增值":[8,9,10,11],
      "財務決策":[12,13,14,15],
      "財富藍圖":[16,17,18,19]
    },

    questions:[
      "我每個月固定將收入的20%以上，在花費之前就先撥入儲蓄或投資帳戶",
      "如果明天失去工作，現有流動資金可以維持正常生活超過12個月",
      "我清楚知道自己每個月固定支出的總金額，誤差在10%以內",
      "我有一筆獨立的緊急備用金（至少3個月支出），從未在非緊急情況下動用過",

      "花費超過月收入5%的金額之前，我會評估長期回報，而不只是當下的滿足感",
      "上個月的支出清單中，「投資型支出」（提升能力、效率或系統）超過10%",
      "我能清楚識別哪些消費是真正需求，哪些是為維持形象或跟隨他人而產生的",
      "我每年花費相當於至少一個月收入在提升自己的學習、能力或工具系統上",

      "我有至少一個不依賴我主動工作時間的收入來源（投資收益、版稅、租金等）",
      "我的被動收入每個月超過我月支出的10%以上",
      "我清楚知道自己主要投資的年化回報率，並且每季至少檢視一次",
      "過去兩年，我的總資產淨值增長幅度超過了生活費用的增長幅度",

      "我很少因為「限時優惠」「別人都在買」或一時衝動，做出超出計劃的重大消費決定",
      "過去一年，我沒有因為情緒（壓力、興奮、焦慮）做出後來感到後悔的重大財務決定",
      "面對投資機會時，我會主動尋找「可能出錯的地方」，而不是只看潛在收益",
      "我每年至少做一次完整的財務盤點，了解自己的資產、負債和現金流狀況",

      "我有一個具體的「財務自由數字」",
      "我的財務計劃有具體年度目標與路徑",
      "過去一年，我的財富增長速度讓我感到滿意",
      "我的伴侶或家人了解我的財務狀況和計劃"
    ]
  },

  energy:{
    title:"精力 ENERGY",
    description:"體能、情緒與恢復能力",

    subDimensions:{
      "身體恢復":[0,1,2,3],
      "專注與認知":[4,5,6,7],
      "情緒韌性":[8,9,10,11],
      "恢復循環":[12,13,14,15],
      "人生平衡":[16,17,18,19]
    },

    questions:new Array(20).fill("請依據你的真實狀態進行評分")
  },

  time:{
    title:"時間 TIME",
    description:"時間主權、深度工作與優先順序管理",

    subDimensions:{
      "時間主權":[0,1,2,3],
      "深度工作":[4,5,6,7],
      "授權系統":[8,9,10,11],
      "高價值配置":[12,13,14,15],
      "節奏管理":[16,17,18,19]
    },

    questions:new Array(20).fill("請依據你的真實狀態進行評分")
  },

  connections:{
    title:"人脈 CONNECTIONS",
    description:"人際資本、合作資源與網絡效益",

    subDimensions:{
      "核心支持":[0,1,2,3],
      "圈層多元":[4,5,6,7],
      "關係維護":[8,9,10,11],
      "價值交換":[12,13,14,15],
      "聲望影響":[16,17,18,19]
    },

    questions:new Array(20).fill("請依據你的真實狀態進行評分")
  },

  ability:{
    title:"能力 CAPABILITY",
    description:"專業能力、學習成長與差異化優勢",

    subDimensions:{
      "市場價值":[0,1,2,3],
      "商業化能力":[4,5,6,7],
      "槓桿能力":[8,9,10,11],
      "學習成長":[12,13,14,15],
      "差異化定位":[16,17,18,19]
    },

    questions:new Array(20).fill("請依據你的真實狀態進行評分")
  }
};

const questionContainer = document.getElementById("questionContainer");

Object.keys(dimensions).forEach(key=>{

  const section=document.createElement("div");
  section.className="section";

  section.innerHTML=`
    <h2>${dimensions[key].title}</h2>
    <p style="color:#64748b;margin-bottom:24px;">
      ${dimensions[key].description}
    </p>
  `;

  dimensions[key].questions.forEach((q,index)=>{

    const question=document.createElement("div");
    question.className="question";

    question.innerHTML=`
      <p>${index+1}. ${q}</p>

      <select data-dimension="${key}" data-index="${index}">
        <option value="">請選擇評分</option>
        <option value="1">1｜幾乎從不</option>
        <option value="2">2｜偶爾</option>
        <option value="3">3｜有時</option>
        <option value="4">4｜經常</option>
        <option value="5">5｜總是</option>
      </select>
    `;

    section.appendChild(question);

  });

  questionContainer.appendChild(section);

});

function calculateDimension(key){

  const selects=document.querySelectorAll(`select[data-dimension="${key}"]`);

  let total=0;
  let count=0;

  selects.forEach(select=>{

    if(select.value!==""){
      total+=Number(select.value);
      count++;
    }

  });

  if(count===0) return 0;

  return ((total/count)*2).toFixed(1);
}

function calculateSubDimension(key,indexes){

  let total=0;
  let count=0;

  indexes.forEach(i=>{

    const select=document.querySelector(
      `select[data-dimension="${key}"][data-index="${i}"]`
    );

    if(select && select.value!==""){
      total+=Number(select.value);
      count++;
    }

  });

  if(count===0) return 0;

  return ((total/count)*2).toFixed(1);
}

function getLevel(score){

  if(score<4.5) return "▼ 系統瓶頸";
  if(score<6.5) return "◆ 待提升";
  if(score<8.5) return "● 良好基礎";

  return "★ 槓桿資產";
}

let radarChart;

function generateReport(){

  const scores={
    money:Number(calculateDimension("money")),
    energy:Number(calculateDimension("energy")),
    time:Number(calculateDimension("time")),
    connections:Number(calculateDimension("connections")),
    ability:Number(calculateDimension("ability"))
  };

  document.getElementById("moneyScore").innerText=scores.money;
  document.getElementById("energyScore").innerText=scores.energy;
  document.getElementById("timeScore").innerText=scores.time;
  document.getElementById("connectionScore").innerText=scores.connections;
  document.getElementById("abilityScore").innerText=scores.ability;

  const overall=((

    scores.money+
    scores.energy+
    scores.time+
    scores.connections+
    scores.ability

  )/5).toFixed(1);

  document.getElementById("miniOverall").innerText=overall;

  document.getElementById("overallText").innerHTML=`
    整體財富轉化效率：
    <strong>${overall} / 10</strong>
  `;

  const reportCards=document.getElementById("reportCards");

  reportCards.innerHTML="";

  Object.keys(scores).forEach(key=>{

    const card=document.createElement("div");

    card.className="report-card";

    let subHTML="";

    Object.entries(dimensions[key].subDimensions).forEach(([subName,indexes])=>{

      const subScore=calculateSubDimension(key,indexes);

      subHTML+=`
        <div class="sub-item">

          <div class="sub-item-title">
            <span>${subName}</span>
            <span>${subScore} / 10</span>
          </div>

          <div class="sub-bar">
            <div
              class="sub-bar-fill"
              style="width:${subScore*10}%">
            </div>
          </div>

        </div>
      `;
    });

    card.innerHTML=`
      <h3>${dimensions[key].title}</h3>

      <p>
        <strong>總分：</strong>
        ${scores[key]} / 10
      </p>

      <div class="status">
        ${getLevel(scores[key])}
      </div>

      <div class="sub-dimension-box">

        <h4>子維度分析</h4>

        ${subHTML}

      </div>
    `;

    reportCards.appendChild(card);

  });

  document.getElementById("reportSection").style.display="block";

  const ctx=document.getElementById("radarChart");

  if(radarChart){
    radarChart.destroy();
  }

  radarChart=new Chart(ctx,{
    type:"radar",

    data:{
      labels:["金錢","精力","時間","人脈","能力"],

      datasets:[{
        label:"五維財富評分",

        data:[
          scores.money,
          scores.energy,
          scores.time,
          scores.connections,
          scores.ability
        ],

        fill:true
      }]
    },

    options:{
      responsive:true,

      scales:{
        r:{
          min:0,
          max:10,

          ticks:{
            stepSize:2
          }
        }
      }
    }
  });

  document.getElementById("radarChart").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

const miniHeader=document.getElementById("miniHeader");

window.addEventListener("scroll",()=>{

  if(window.scrollY>280){
    miniHeader.classList.add("show");
  }else{
    miniHeader.classList.remove("show");
  }

});

</script>

</body>
</html>

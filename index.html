function calculateDimension(key){

  const selects=document.querySelectorAll(`select[data-dimension="${key}"]`);

  let total=0;
  let count=0;

  selects.forEach(select=>{

    if(select.value!==""){
      total+=Number(select.value);
      count++;
    }

  });

  if(count===0) return 0;

  return ((total/count)*2).toFixed(1);
}

function calculateSubDimension(key,indexes){

  let total=0;
  let count=0;

  indexes.forEach(i=>{

    const select=document.querySelector(
      `select[data-dimension="${key}"][data-index="${i}"]`
    );

    if(select && select.value!==""){
      total+=Number(select.value);
      count++;
    }

  });

  if(count===0) return 0;

  return ((total/count)*2).toFixed(1);
}

function getLevel(score){

  if(score<8.5) return "● 良好基礎";

  return "★ 槓桿資產";
}

let radarChart;

function generateReport(){

  const scores={
    money:Number(calculateDimension("money")),
    energy:Number(calculateDimension("energy")),
    time:Number(calculateDimension("time")),
    connections:Number(calculateDimension("connections")),
    ability:Number(calculateDimension("ability"))
  };

  document.getElementById("moneyScore").innerText=scores.money;
  document.getElementById("energyScore").innerText=scores.energy;
  document.getElementById("timeScore").innerText=scores.time;
  document.getElementById("connectionScore").innerText=scores.connections;
  document.getElementById("abilityScore").innerText=scores.ability;

  const overall=((

    scores.money+
    scores.energy+
    scores.time+
    scores.connections+
    scores.ability

  )/5).toFixed(1);

  document.getElementById("miniOverall").innerText=overall;

  document.getElementById("overallText").innerHTML=`
    整體財富轉化效率：
    <strong>${overall} / 10</strong>
  `;

  const reportCards=document.getElementById("reportCards");

  reportCards.innerHTML="";

  Object.keys(scores).forEach(key=>{

    const card=document.createElement("div");

    card.className="report-card";

    let subHTML="";

    Object.entries(dimensions[key].subDimensions).forEach(([subName,indexes])=>{

      const subScore=calculateSubDimension(key,indexes);

      subHTML+=`
        <div class="sub-item">

          <div class="sub-item-title">
            <span>${subName}</span>
            <span>${subScore} / 10</span>
          </div>

          <div class="sub-bar">
            <div
              class="sub-bar-fill"
              style="width:${subScore*10}%">
            </div>
          </div>

        </div>
      `;
    });

    card.innerHTML=`
      <h3>${dimensions[key].title}</h3>

      <p>
        <strong>總分：</strong>
        ${scores[key]} / 10
      </p>

      <div class="status">
        ${getLevel(scores[key])}
      </div>

      <div class="sub-dimension-box">

        <h4>子維度分析</h4>

        ${subHTML}

      </div>
    `;

    reportCards.appendChild(card);

  });

  document.getElementById("reportSection").style.display="block";

  const ctx=document.getElementById("radarChart");

  if(radarChart){
    radarChart.destroy();
  }

  radarChart=new Chart(ctx,{
    type:"radar",

    data:{
      labels:["金錢","精力","時間","人脈","能力"],

      datasets:[{
        label:"五維財富評分",

        data:[
          scores.money,
          scores.energy,
          scores.time,
          scores.connections,
          scores.ability
        ],

        fill:true
      }]
    },

    options:{
      responsive:true,

      scales:{
        r:{
          min:0,
          max:10,

          ticks:{
            stepSize:2
          }
        }
      }
    }
  });

  document.getElementById("radarChart").scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

const miniHeader=document.getElementById("miniHeader");

window.addEventListener("scroll",()=>{

  if(window.scrollY>280){
    miniHeader.classList.add("show");
  }else{
    miniHeader.classList.remove("show");
  }

});

</script>
